<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷史專區 — ciallo</title>
<meta name="description" content="中四、中五歷史科筆記，共 12 本，可以直接在網頁上看。">
<meta name="theme-color" content="#171a21">
<meta name="color-scheme" content="dark">

<!--
  歷史專區（子頁面）
  ----------------------------------------------------------------------------
  跟 chinese.html 共用同一份程式 study.js，差別只在 <body> 上的 data 屬性：
    data-study-page="subject"  → 這是一頁專區
    data-subject="history"     → 要讀 data.js 的哪一個區塊

  刻意不載入 script.js —— 那個是主頁用的，會去找主頁才有的元素。

  筆記的 PDF 放在 history/ 資料夾（檔名都是 ASCII）。
  書單與文字設定在 data.js 的 history 區塊。
-->

<link rel="icon" href="images/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-study-page="subject" data-subject="history">

<div class="page">

  <!-- 子頁面的簡易頁首（不是主頁那條分區導覽） -->
  <header class="subhead">
    <div class="subhead__top">
      <a class="subhead__back" id="sub-back" href="study.html">← 回到溫習</a>
      <!-- 冷戰時期歷史音樂（獨立分頁，所以帶一個離開本頁的箭頭）-->
      <a class="subhead__action" href="history/music/">
        <span aria-hidden="true">🎵</span> 歷史音樂 <span class="subhead__action-arrow" aria-hidden="true">↗</span>
      </a>
    </div>
    <h1 class="subhead__title" id="sub-title"></h1>
    <p class="subhead__sub" id="sub-sub"></p>
    <p class="subhead__desc" id="sub-desc"></p>
  </header>

  <main>
    <!-- 書單（由 study.js 生成） -->
    <div id="history-list"></div>

    <!-- 閱讀器：點書名之後才會出現 -->
    <section class="section reader" id="reader" hidden>
      <div class="reader__bar">
        <h2 class="reader__title" id="reader-title"></h2>
        <div class="reader__actions">
          <a class="btn btn--primary" id="reader-open" href="#" target="_blank" rel="noopener noreferrer">在新分頁開啟 ↗</a>
          <a class="btn btn--ghost" id="reader-download" href="#" download>下載 PDF</a>
          <button class="btn btn--ghost" type="button" id="reader-close">收起閱讀器</button>
        </div>
      </div>
      <p class="reader__hint" id="reader-hint"></p>
      <div class="reader__stage">
        <iframe class="reader__frame" id="reader-frame" title="筆記內容" loading="lazy"></iframe>
      </div>
    </section>

    <noscript>
      <p class="reader__hint">這個頁面需要 JavaScript 才能列出書單。請開啟 JavaScript 後重新整理。</p>
    </noscript>
  </main>

  <footer class="footer" id="sub-footer"></footer>
</div>

<script src="data.js"></script>
<script src="study.js"></script>
</body>
</html>
