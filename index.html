<!DOCTYPE html>
<!--
  index.html — 版面骨架
  ---------------------------------------------------------------------------
  這裡刻意「不放任何內容」：所有文字、連結、遊戲卡片都由 script.js 讀取
  data.js 後自動生成。要改內容請改 data.js，不要改這個檔案。

  為什麼用傳統 <script> 而不是 type="module"？
    因為這樣你直接雙擊 index.html（file:// 開啟）也能正常運作；
    ES module 在 file:// 下會被瀏覽器的 CORS 規則擋住。
-->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>載入中…</title>
  <meta name="description" content="Steam 風格的個人遊戲主頁">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="images/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 分區導覽列（由 script.js 依實際存在的區塊生成） -->
  <nav id="section-nav" class="section-nav" aria-label="區塊導覽"></nav>

  <div class="page">

    <!-- ① 頂部個人資料橫幅 -->
    <header id="banner" class="banner">
      <div class="banner__bg" id="banner-bg"></div>
      <div class="banner__overlay"></div>
      <!-- 橫幅右上角：會員註冊按鈕（由 script.js 生成） -->
      <div class="banner__corner" id="banner-corner"></div>
      <div class="banner__content" id="banner-content"></div>
    </header>

    <main class="main">

      <!-- ② 遊戲展示櫃（核心） -->
      <section id="sec-favorites" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">★</span>最愛遊戲</h2>
          <p class="section__desc">點卡片可以直接開 Steam 商店頁</p>
        </div>
        <div class="grid grid--games" id="favorites-grid"></div>
      </section>

      <section id="sec-recent" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">◷</span>最近在玩</h2>
          <p class="section__desc">Steam 的「最近兩週」統計</p>
        </div>
        <div class="grid grid--recent" id="recent-grid"></div>
      </section>

      <section id="sec-perfect" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon section__icon--gold" aria-hidden="true">✦</span>全成就</h2>
          <p class="section__desc">成就 100% 的遊戲</p>
        </div>
        <div class="grid grid--perfect" id="perfect-grid"></div>
      </section>

      <section id="sec-wishlist" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">♡</span>願望清單</h2>
          <p class="section__desc">總有一天會買的（大概）</p>
        </div>
        <div class="grid grid--wishlist" id="wishlist-grid"></div>
      </section>

      <!-- ④ My Favorite Music（最愛音樂） -->
      <section id="sec-music" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">♪</span><span id="music-title"></span></h2>
          <p class="section__desc" id="music-desc"></p>
        </div>
        <div id="music-content"></div>
      </section>

      <!-- ⑤ 其他連結 -->
      <section id="sec-links" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">⚯</span>其他連結</h2>
          <p class="section__desc">想找我可以在這些地方</p>
        </div>
        <div class="grid grid--links" id="links-grid"></div>
      </section>

      <!-- ⑥ 關於我／留言板 -->
      <section id="sec-about" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">◈</span>關於我</h2>
        </div>
        <div class="about" id="about-content"></div>
      </section>

      <section id="sec-guestbook" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon" aria-hidden="true">✎</span>留言板</h2>
          <p class="section__desc" id="guestbook-desc"></p>
        </div>
        <div id="guestbook-content"></div>
      </section>

      <!-- ⑦ 特別鳴謝（放在頁面最後） -->
      <section id="sec-thanks" class="section">
        <div class="section__head">
          <h2 class="section__title"><span class="section__icon section__icon--gold" aria-hidden="true">♥</span>特別鳴謝</h2>
        </div>
        <div id="thanks-content"></div>
      </section>

      <!--
        ⑧ 圖片彩蛋：特別鳴謝下面一小張縮圖，點 3 次會打開 1～9 的畫廊。
        刻意做得很低調，不影響正常瀏覽。文字與圖片在 data.js 的 galleryEgg。
      -->
      <div class="egg-thumb" id="gallery-egg-trigger"></div>

    </main>

    <!-- ⑥ 頁尾 -->
    <footer class="footer" id="footer"></footer>
  </div>

  <!-- 捐款彈窗（頁尾的「💰 捐款」按下去開這個，內容由 script.js 從 data.js 生成） -->
  <div class="modal modal--donate" id="donate-modal" hidden>
    <div class="modal__backdrop" data-close-donate></div>
    <div class="modal__panel modal__panel--donate" role="dialog" aria-modal="true" aria-labelledby="donate-title">
      <button class="modal__close" type="button" data-close-donate aria-label="關閉">×</button>
      <div id="donate-content"></div>
    </div>
  </div>

  <!-- 圖片畫廊彈窗（點 ciallo 縮圖 3 次後出現，內容由 script.js 生成） -->
  <div class="modal modal--gallery" id="gallery-modal" hidden>
    <div class="modal__backdrop" data-close-gallery></div>
    <div class="modal__panel modal__panel--gallery" role="dialog" aria-modal="true" aria-labelledby="gallery-title">
      <button class="modal__close" type="button" data-close-gallery aria-label="關閉">×</button>
      <div id="gallery-content"></div>
    </div>
  </div>

  <!-- 會員註冊彈窗（玩笑性質，內容由 script.js 從 data.js 生成） -->
  <div class="modal modal--member" id="member-modal" hidden>
    <div class="modal__backdrop" data-close-member></div>
    <div class="modal__panel modal__panel--member" role="dialog" aria-modal="true" aria-labelledby="member-title">
      <button class="modal__close" type="button" data-close-member aria-label="關閉">×</button>
      <div id="member-content"></div>
    </div>
  </div>

  <!-- 彩蛋彈窗（內容由 script.js 從 data.js 生成） -->
  <div class="modal" id="egg-modal" hidden>
    <div class="modal__backdrop" data-close-egg></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="egg-title">
      <button class="modal__close" type="button" data-close-egg aria-label="關閉">×</button>
      <div id="egg-content"></div>
    </div>
  </div>

  <!-- 影片彈窗（特別鳴謝的按鈕按下去會開這個，內容由 script.js 生成） -->
  <div class="modal modal--video" id="video-modal" hidden>
    <div class="modal__backdrop" data-close-video></div>
    <div class="modal__panel modal__panel--video" role="dialog" aria-modal="true" aria-labelledby="video-title">
      <button class="modal__close" type="button" data-close-video aria-label="關閉">×</button>
      <h2 class="video-modal__title" id="video-title"></h2>
      <div class="video-box" id="video-box"></div>
      <p class="video-modal__alt" id="video-alt"></p>
    </div>
  </div>

  <!--
    彩蛋提示：在頁面上任何位置「連續輸入」ciallo 試試看。
    觸發後會出現「廣告位招租」。
  -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
